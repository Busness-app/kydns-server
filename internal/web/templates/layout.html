{{define "body"}}
<div class="app">
  <nav class="app-nav">
    <h1>KyDNS</h1>
    <a href="/"{{if eq .Nav "dashboard"}} aria-current="page"{{end}}>Dashboard</a>
    <a href="/services"{{if eq .Nav "services"}} aria-current="page"{{end}}>Services</a>
    <a href="/records"{{if eq .Nav "records"}} aria-current="page"{{end}}>Records</a>
    <a href="/discovered"{{if eq .Nav "discovered"}} aria-current="page"{{end}}>Discovered</a>
    <a href="/blacklists"{{if eq .Nav "blacklists"}} aria-current="page"{{end}}>Blacklists</a>
    <a href="/settings"{{if eq .Nav "settings"}} aria-current="page"{{end}}>Settings</a>
    <form method="post" action="/logout" style="padding:1rem 1.25rem">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <button class="ghost" type="submit">Sign out</button>
    </form>
    <footer class="app-footer">
      <button type="button" class="license-link" popovertarget="about">
        &copy; {{.Year}} &middot; Licensed under AGPL v3
      </button>
    </footer>
  </nav>
  <div id="about" popover class="license-window">
    <div class="license-header">
      <div>
        <p class="license-app">KyDNS <span class="badge accent">v{{.Version}}</span></p>
        <p>Developed by Busnes.app</p>
        <p>&copy; {{.Year}} &middot; Licensed under AGPL v3</p>
      </div>
      <button type="button" class="ghost" popovertarget="about" popovertargetaction="hide">Close</button>
    </div>
    <iframe class="license-text" src="/static/agpl-3.0.txt" loading="lazy"
            title="GNU Affero General Public License v3"></iframe>
  </div>
  <main class="app-main">
    <h2>{{.Title}}</h2>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    {{template "page" .}}
  </main>
</div>
{{end}}
