{{define "body"}}
<div class="centered card">
  <h2>Sign in</h2>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  {{if .SSOEnabled}}
  <div style="margin-bottom: 1.25rem; text-align: center;">
    <a href="/auth/sso/login" class="button" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; text-decoration: none; padding: 0.6rem 1rem; box-sizing: border-box; background: rgba(77, 238, 234, 0.15); border: 1px solid #4deeea; color: #4deeea; font-weight: bold; border-radius: 4px;">
      <svg width="18" height="18" viewBox="0 0 64 64" fill="none" style="vertical-align: middle;">
        <path d="M32 10 L48 16 V30 C48 41.5 41.2 50.2 32 54 C22.8 50.2 16 41.5 16 30 V16 L32 10 Z" fill="#121820" stroke="#4deeea" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="32" cy="27" r="5" fill="#4deeea"/>
        <path d="M32 32 V42 M29 42 H35" stroke="#4deeea" stroke-width="4" stroke-linecap="round"/>
      </svg>
      Sign in with KySignOn
    </a>
    <div style="margin: 1rem 0; color: #64748b; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
      <span style="height: 1px; background: #334155; flex: 1;"></span>
      <span>or local password</span>
      <span style="height: 1px; background: #334155; flex: 1;"></span>
    </div>
  </div>
  {{end}}
  <form class="stack" method="post" action="/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Sign in</button>
  </form>
</div>
{{end}}
