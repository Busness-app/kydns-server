{{define "body"}}
<div class="auth">
<div class="brand">{{template "mark"}}<h1>KyDNS</h1></div>
<div class="centered card">
  <h2>Sign in</h2>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  {{if .SSOEnabled}}
  <a href="/auth/sso/login" class="button sso-button">
      <svg width="18" height="18" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M32 10 L48 16 V30 C48 41.5 41.2 50.2 32 54 C22.8 50.2 16 41.5 16 30 V16 L32 10 Z" fill="#121820" stroke="#4deeea" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="32" cy="27" r="5" fill="#4deeea"/>
        <path d="M32 32 V42 M29 42 H35" stroke="#4deeea" stroke-width="4" stroke-linecap="round"/>
      </svg>
      Sign in with KySignOn
  </a>
  <p class="or-divider">or local password</p>
  {{end}}
  <form class="stack" method="post" action="/login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Sign in</button>
  </form>
</div>
</div>
{{end}}
