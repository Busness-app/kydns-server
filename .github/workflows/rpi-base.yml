name: Raspberry Pi base

# Dependabot cannot watch a plain download, so the pin in
# packaging/rpi-base.pin gets its own updater. It proposes the newest
# Raspberry Pi OS Lite arm64 release that has been published for three days,
# and only after building an image on it here — a pull request opened with
# GITHUB_TOKEN does not start CI, so this job is the check.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpi-base
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: the newest release that has soaked for three days
        id: pin
        run: |
          set -eu
          new=$(SOAK_DAYS=3 ./scripts/rpi-base-latest.sh)
          if [ "$new" = "$(cat packaging/rpi-base.pin)" ]; then
            echo "the pin is already the newest soaked release"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$new" > packaging/rpi-base.pin
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      # The whole point of the pin is that a release is built on a known base.
      # Proposing one nobody has booted a builder against would just move the
      # breakage to the tag.
      - name: the new base builds an image
        if: steps.pin.outputs.changed == 'yes'
        run: |
          set -eux
          read -r url sha < packaging/rpi-base.pin
          : > kydns_pin_arm64.deb
          mkdir -p dist
          sudo ./scripts/build-rpi-image.sh kydns_pin_arm64.deb dist/pin.img "$url" "$sha"
          loop=$(sudo losetup --find --show --partscan dist/pin.img)
          mkdir -p mnt
          sudo mount "${loop}p2" mnt
          sudo test -f mnt/opt/kydns/kydns.deb
          sudo test -L mnt/etc/systemd/system/multi-user.target.wants/kydns-image-install.service
          sudo umount mnt
          sudo losetup -d "$loop"
          rm -rf dist mnt kydns_pin_arm64.deb

      - name: propose it
        if: steps.pin.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          read -r url _ < packaging/rpi-base.pin
          # One branch per release, so a weekly re-run of the same proposal
          # neither reopens a pull request that was closed on purpose nor
          # pushes over one that is still open.
          branch="rpi-base/$(basename "$(dirname "$url")")"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists; nothing to propose"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packaging/rpi-base.pin
          git commit -m "build: pin the Raspberry Pi base to $(basename "$url")"
          git push -u origin "$branch"
          gh pr create --title "build: pin the Raspberry Pi base to $(basename "$url")" \
            --body "$(printf '%s\n' \
              "Newest Raspberry Pi OS Lite arm64 release with three days of soak." \
              "" \
              "Base: $url" \
              "" \
              "This job built and mounted an SD image on it before opening this." \
              "CI does not run on a pull request opened with GITHUB_TOKEN, so that" \
              "build is the check: [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).")"
