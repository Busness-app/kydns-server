services:
  kydns:
    build: .
    image: kydns:latest
    container_name: kydns
    restart: unless-stopped

    # The container gets its own address on your LAN, so it owns port 53 there
    # and never contends with systemd-resolved or dnsmasq on the host.
    # Settings live in .env — copy .env.example and edit.
    networks:
      lan:
        ipv4_address: ${KYDNS_IP:?set KYDNS_IP in .env}

    # Binding port 53 needs this one capability. Everything else is dropped.
    # The process runs as root only because a non-root process cannot use an
    # inherited capability without file capabilities on the binary, which do
    # not survive image transport reliably. One capability and no others is a
    # smaller surface than the alternative complexity.
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true

    volumes:
      # The config is read once at startup. Read-only: KyDNS never writes it.
      - ${KYDNS_CONFIG:-./kydns.yaml}:/etc/kydns/kydns.yaml:ro
      # Database plus the first-run setup and bootstrap tokens. Back this up.
      #
      # Use a named volume, not a host directory. Dropping ALL capabilities
      # removes CAP_DAC_OVERRIDE, so the container cannot write into a
      # directory owned by another user — a bind mount from your home
      # directory fails with "unable to open database file". If you do want a
      # bind mount, chown it to root first.
      - kydns-data:/var/lib/kydns

    # Structured logs go to stdout; let the platform collect them.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # An existing LAN-attached network, created and owned by the host — not by
  # this file. On unRAID that is br0. Anything already giving containers real
  # LAN addresses works: AdGuard Home or Pi-hole on the same network is the
  # sign you have one.
  #
  # Compose joins it and never creates or removes it. A network that hands out
  # addresses on your physical LAN outlives any one stack, so `compose down`
  # has no business tearing it down.
  #
  # No such network? `make up` creates it. By hand it is:
  #
  #   docker network create -d ipvlan \
  #     -o parent=eth0 \
  #     --subnet 192.168.1.0/24 --gateway 192.168.1.1 \
  #     --ip-range 192.168.1.53/32 \
  #     br0
  #
  # The /32 range confines Docker to the one address KyDNS uses. Give it the
  # whole subnet and it will eventually pick one your router leases to a
  # phone, which presents as DNS failing at unpredictable hours.
  lan:
    name: ${KYDNS_NETWORK:-br0}
    external: true

volumes:
  kydns-data:

# ---------------------------------------------------------------------------
# Setup
#
# 1. cp .env.example .env        and set KYDNS_IP
#
#    Already run AdGuard Home or Pi-hole with a LAN address? KyDNS joins the
#    same network — set KYDNS_NETWORK to its name if it is not br0.
#
# 2. cp kydns.example.yaml kydns.yaml
#
#    Change two things in kydns.yaml from their defaults:
#
#      data_dir: /var/lib/kydns
#      admin:
#        listen: "0.0.0.0:8053"
#
#    admin.listen MUST NOT stay 127.0.0.1 here. On its own network the
#    container's loopback is its own, so 127.0.0.1 would be reachable from
#    nowhere at all. 0.0.0.0:8053 means the container's LAN address only —
#    it is not on the host. Put a TLS-terminating proxy in front if you want
#    encryption; KyDNS speaks plain HTTP.
#
# 3. make up
#
#    That runs scripts/create-network.sh, which creates the network only if it
#    is missing, then starts the stack. `make network` alone shows the values
#    it derived without starting anything.
#
# 4. docker compose logs kydns | grep setup-token
#    Open http://$KYDNS_IP:8053/ and complete setup with that token.
# 5. Point a client at $KYDNS_IP for DNS and try:
#      dig @$KYDNS_IP kypost.home.arpa
#
# Running alongside AdGuard Home or Pi-hole
#
#   Give KYDNS_IP an address the other one is not using. Both can hold port 53
#   at once, because each has its own LAN address. That is the point of this
#   network, and it is what lets you cut over one client at a time instead of
#   swapping the whole house at once.
#
# The host cannot reach the container
#
#   macvlan and ipvlan both deliberately block traffic between the host and
#   its own containers. Everything else on the LAN reaches KyDNS fine; only
#   the Docker host itself cannot. That matters if the host resolves through
#   KyDNS, or if KyDNS health-checks a service running on the host.
#
#   Fix with a shim interface. Match the parent of your network, which
#   `docker network inspect <name>` reports:
#
#     sudo ip link add kydns-shim link eth0 type ipvlan mode l2
#     sudo ip addr add 192.168.1.2/32 dev kydns-shim
#     sudo ip link set kydns-shim up
#     sudo ip route add 192.168.1.53/32 dev kydns-shim
#
#   Use `type macvlan mode bridge` if you overrode the driver. Either way the
#   shim is not persistent; add it to systemd-networkd or your distro's
#   equivalent once it works.
# ---------------------------------------------------------------------------
