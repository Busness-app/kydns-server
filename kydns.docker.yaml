# The configuration baked into the container image at /etc/kydns/kydns.yaml.
#
# It sets exactly two settings, both wrong for a container at their defaults
# and both owned by the config file — KyDNS needs them before it has a database
# or a web UI, so there is nowhere else they could come from. The third
# file-owned setting, dns.listen, is already right at its default.
#
# Everything else is left out on purpose. Those keys seed the database on the
# first run and are edited afterwards under Settings in the web UI, with
# `kydns settings set`, or over the API — putting them here would only change
# what a brand-new container starts with. See kydns.example.yaml for the
# defaults and the reasoning behind them.
#
# Mount your own file over /etc/kydns/kydns.yaml to replace this one.

# The volume the image declares. Holds kydns.db plus the setup and bootstrap
# tokens; back it up.
data_dir: /var/lib/kydns

admin:
  # The default, 127.0.0.1:8053, would bind the *container's* loopback, which
  # is reachable from nowhere at all. 0.0.0.0 here means the container's own
  # addresses only — with a LAN-attached network that is its LAN address, and
  # with a bridge network it is whatever ports you publish.
  #
  # KyDNS speaks plain HTTP. Put a TLS-terminating reverse proxy in front of
  # it if you expose it beyond your LAN.
  listen: "0.0.0.0:8053"
